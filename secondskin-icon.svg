<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Second Skin">
  <defs>
    <pattern id="stripes" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(135)">
      <rect width="4" height="8" fill="#3ea89b"/>
      <rect x="4" width="4" height="8" fill="#080b0a"/>
    </pattern>
    <radialGradient id="glow" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#5fe8d3" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#080b0a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="32" height="32" fill="#080b0a"/>
  <rect width="32" height="32" fill="url(#stripes)"/>
  <rect width="32" height="32" fill="url(#glow)"/>
</svg>
